<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Movie details in Seenetrica." />
    <title>Movie detail — Seenetrica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/memories.css" />
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/memories.js" defer></script>
    <script src="../js/movie-detail.js" defer></script>
  </head>

  <body data-root=".." data-page="detail">
    <main class="detail-page page-shell">
      <a class="detail-back" href="../index.html">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        Back to archive
      </a>

      <div id="detailStatus" class="loading-state" role="status">
        Loading title…
      </div>
      <article id="movieDetail" class="detail-layout" hidden></article>
    </main>

    <div
      class="memory-modal"
      id="memoryUploadModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memoryUploadTitle"
      hidden
    >
      <button
        class="memory-modal-backdrop"
        type="button"
        data-close-memory-upload
        aria-label="Close memory upload"
      ></button>

      <section class="memory-modal-dialog">
        <div class="memory-modal-header">
          <div>
            <p class="section-kicker">Personal archive</p>
            <h2 id="memoryUploadTitle">Add memories</h2>
            <p>Upload files or add an image via URL / Google Drive.</p>
          </div>

          <button
            class="icon-button light-icon-button"
            type="button"
            data-close-memory-upload
            aria-label="Close"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <form id="detailMemoryForm">
          <div
            style="
              display: flex;
              gap: 20px;
              margin-bottom: 20px;
              padding-bottom: 20px;
              border-bottom: 1px solid var(--line);
            "
          >
            <label class="checkbox-field">
              <input type="radio" name="memorySource" value="upload" checked />
              Upload Media
            </label>
            <label class="checkbox-field">
              <input type="radio" name="memorySource" value="url" />
              Link URL / Drive
            </label>
          </div>

          <div id="memorySourceUpload">
            <label class="memory-upload-dropzone" for="detailMemoryFiles">
              <i data-lucide="images" aria-hidden="true"></i>
              <strong>Choose up to 10 photos or videos</strong>
              <span
                >JPEG, PNG, WebP, MP4, WebM, MOV, or M4V · maximum 15 MB
                each</span
              >
            </label>

            <input
              class="sr-only"
              id="detailMemoryFiles"
              type="file"
              accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime,video/x-m4v"
              multiple
            />

            <div
              class="memory-drafts"
              id="detailMemoryDrafts"
              aria-live="polite"
            ></div>

            <p class="memory-helper" id="detailMemoryStatus" role="status">
              Photos stay HD up to 3200 px. Videos are uploaded in their
              original quality.
            </p>
          </div>

          <div id="memorySourceUrl" class="form-grid" hidden>
            <label class="form-field is-full">
              <span>Image URL (Direct or Google Drive)</span>
              <input type="url" id="urlMemoryLink" placeholder="https://..." />
            </label>

            <label class="form-field">
              <span>Type</span>
              <select id="urlMemoryType">
                <option value="photo">Photo</option>
                <option value="ticket">Ticket</option>
                <option value="poster">Poster</option>
                <option value="screenshot">Screenshot</option>
                <option value="other">Other</option>
              </select>
            </label>

            <label class="form-field">
              <span>Date (optional)</span>
              <input type="date" id="urlMemoryDate" />
            </label>

            <label class="form-field is-full">
              <span>Caption (optional)</span>
              <input
                type="text"
                id="urlMemoryCaption"
                maxlength="1000"
                placeholder="What does this memory hold?"
              />
            </label>
          </div>

          <div class="memory-modal-actions">
            <button class="text-button" type="button" data-close-memory-upload>
              Cancel
            </button>

            <button
              class="primary-button"
              id="uploadMemoriesButton"
              type="submit"
              aria-busy="false"
            >
              <i data-lucide="upload" aria-hidden="true"></i>
              <span class="button-spinner" data-button-spinner hidden></span>
              <span data-button-label>Save memories</span>
            </button>
          </div>
        </form>
      </section>
    </div>

    <div
      class="memory-lightbox"
      id="memoryLightbox"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memoryLightboxTitle"
      hidden
    >
      <button
        class="memory-lightbox-backdrop"
        type="button"
        data-close-memory-lightbox
        aria-label="Close memory"
      ></button>

      <section class="memory-lightbox-dialog">
        <div class="memory-lightbox-media">
          <img id="memoryLightboxImage" src="" alt="" />
          <video
            id="memoryLightboxVideo"
            controls
            playsinline
            preload="metadata"
            hidden
          ></video>
        </div>

        <div class="memory-lightbox-panel">
          <div class="memory-lightbox-header">
            <div class="memory-lightbox-copy">
              <p class="section-kicker">Memory</p>
              <h2 id="memoryLightboxTitle">A moment from this film</h2>
              <p id="memoryLightboxMeta">Photo</p>
            </div>

            <button
              class="icon-button light-icon-button"
              type="button"
              data-close-memory-lightbox
              aria-label="Close"
            >
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </div>

          <form class="memory-lightbox-form" id="memoryEditForm">
            <label class="form-field">
              <span>Type</span>
              <select id="memoryEditType">
                <option value="photo">Photo</option>
                <option value="ticket">Ticket</option>
                <option value="poster">Poster</option>
                <option value="screenshot">Screenshot</option>
                <option value="other">Other</option>
              </select>
            </label>

            <label class="form-field">
              <span>Date (optional)</span>
              <input id="memoryEditDate" type="date" />
            </label>

            <label class="form-field">
              <span>Caption</span>
              <textarea
                id="memoryEditCaption"
                maxlength="1000"
                placeholder="What does this memory hold?"
              ></textarea>
            </label>

            <div class="memory-lightbox-actions">
              <button
                class="primary-button"
                id="saveMemoryButton"
                type="submit"
              >
                <i data-lucide="save" aria-hidden="true"></i>
                Save memory details
              </button>

              <button
                class="danger-button"
                id="deleteMemoryButton"
                type="button"
              >
                <i data-lucide="trash-2" aria-hidden="true"></i>
                Delete memory
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
