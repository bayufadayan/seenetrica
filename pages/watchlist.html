<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Movies and series saved in Seenetrica." />
    <title>Watchlist — Seenetrica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/watchlist.js" defer></script>
  </head>

  <body data-root=".." data-page="watchlist">
    <main>
      <section class="page-hero page-shell">
        <div>
          <p class="eyebrow">Saved for the right night</p>
          <h1>Your <span>watchlist.</span></h1>
          <p class="page-hero-description">
            Released titles you are interested in, waiting until you press play.
          </p>
        </div>
        <div class="page-stat">
          <strong id="watchlistCount">—</strong>
          <span>saved titles</span>
        </div>
      </section>

      <section class="page-content page-shell">
        <div class="collection-tools">
          <label class="archive-search" for="watchlistSearch">
            <i data-lucide="search" aria-hidden="true"></i>
            <span class="sr-only">Search watchlist</span>
            <input
              id="watchlistSearch"
              type="search"
              autocomplete="off"
              placeholder="Search your watchlist"
            />
          </label>
          <div class="tool-chips" role="group" aria-label="Media type filters">
            <button class="chip-button is-active" type="button" data-type="">
              All
            </button>
            <button class="chip-button" type="button" data-type="movie">
              Movies
            </button>
            <button class="chip-button" type="button" data-type="series">
              Series
            </button>
          </div>
        </div>

        <p class="collection-status" id="watchlistStatus" role="status">
          Loading watchlist…
        </p>
        <div id="watchlistGrid" class="collection-grid"></div>
      </section>
    </main>
  </body>
</html>
