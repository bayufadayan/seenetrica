<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upcoming movies planned in Seenetrica." />
    <title>Planned — Seenetrica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/planned.js" defer></script>
  </head>

  <body data-root=".." data-page="planned">
    <main>
      <section class="page-hero page-shell">
        <div>
          <p class="eyebrow">Stories on the horizon</p>
          <h1>Cinema <span>plans.</span></h1>
          <p class="page-hero-description">
            Upcoming releases that look interesting enough to meet on the big
            screen.
          </p>
        </div>
        <div class="page-stat">
          <strong id="plannedCount">—</strong>
          <span>upcoming titles</span>
        </div>
      </section>

      <section class="page-content page-shell">
        <div class="collection-tools">
          <label class="archive-search" for="plannedSearch">
            <i data-lucide="search" aria-hidden="true"></i>
            <span class="sr-only">Search planned titles</span>
            <input
              id="plannedSearch"
              type="search"
              autocomplete="off"
              placeholder="Search planned titles"
            />
          </label>
          <div class="tool-chips" role="group" aria-label="Sort planned titles">
            <button
              class="chip-button is-active"
              type="button"
              data-sort="date"
            >
              Release date
            </button>
            <button class="chip-button" type="button" data-sort="added">
              Recently added
            </button>
          </div>
        </div>

        <p class="collection-status" id="plannedStatus" role="status">
          Loading plans…
        </p>
        <div id="plannedGrid" class="collection-grid"></div>
      </section>
    </main>
  </body>
</html>
