<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A chronological list of movies and series watched in theaters."
    />
    <title>Cinema Diary — Seenetrica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/cinema.css" />

    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/cinema.js" defer></script>
  </head>

  <body data-root=".." data-page="cinema">
    <main>
      <section class="page-hero page-shell">
        <div>
          <p class="eyebrow">Big screens, remembered</p>
          <h1>Cinema <span>diary.</span></h1>
          <p class="page-hero-description">
            Every title watched in a theater, listed from the latest screening
            backward.
          </p>
        </div>

        <div class="page-stat">
          <strong id="cinemaCount">—</strong>
          <span>theater visits</span>
        </div>
      </section>

      <section class="page-content page-shell cinema-page-content">
        <div class="cinema-section-heading">
          <div>
            <p class="section-kicker">In theaters</p>
            <h2 class="section-title">Latest screenings</h2>
          </div>

          <p id="cinemaStatus" class="collection-status" role="status">
            Loading cinema diary…
          </p>
        </div>

        <div id="cinemaList" class="cinema-list" hidden></div>
      </section>
    </main>
  </body>
</html>
